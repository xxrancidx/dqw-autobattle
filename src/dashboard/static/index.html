<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQW AutoBattle Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        h1 { margin-bottom: 20px; color: #e94560; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #16213e; border-radius: 8px; padding: 20px; }
        .card h2 { font-size: 1rem; color: #0f3460; margin-bottom: 10px; }
        #status { font-size: 1.5rem; font-weight: bold; color: #e94560; }
        .controls button {
            padding: 10px 20px; margin: 5px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 1rem; color: #fff;
        }
        .controls .start { background: #4caf50; }
        .controls .stop { background: #f44336; }
        #log {
            background: #0a0a1a; border-radius: 4px; padding: 10px;
            height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85rem;
        }
        .stats span { display: inline-block; margin-right: 20px; }
    </style>
</head>
<body>
    <h1>DQW AutoBattle Dashboard</h1>
    <div class="grid">
        <div class="card">
            <h2>System Status</h2>
            <div id="status">IDLE</div>
            <div class="stats">
                <span>Battles: <strong id="battles">0</strong></span>
                <span>Errors: <strong id="errors">0</strong></span>
                <span>Uptime: <strong id="uptime">00:00:00</strong></span>
            </div>
        </div>
        <div class="card controls">
            <h2>Controls</h2>
            <button class="start" onclick="startSystem()">Start</button>
            <button class="stop" onclick="stopSystem()">Stop</button>
        </div>
        <div class="card" style="grid-column: 1 / -1;">
            <h2>Log Stream</h2>
            <div id="log"></div>
        </div>
    </div>
    <script>
        const logEl = document.getElementById("log");
        const statusEl = document.getElementById("status");
        let ws;

        function connectWs() {
            ws = new WebSocket(`ws://${location.host}/ws`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "log") {
                    const line = document.createElement("div");
                    line.textContent = data.message;
                    logEl.appendChild(line);
                    logEl.scrollTop = logEl.scrollHeight;
                }
                if (data.state) {
                    statusEl.textContent = data.state;
                }
            };
            ws.onclose = () => setTimeout(connectWs, 3000);
        }

        async function startSystem() {
            await fetch("/api/start", { method: "POST" });
        }

        async function stopSystem() {
            await fetch("/api/stop", { method: "POST" });
        }

        connectWs();
    </script>
</body>
</html>
